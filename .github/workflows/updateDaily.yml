name: Get files at Fri, Sat, Sun

on:
  schedule:
    - cron: '0 9 * * FRI,SAT,SUN'
  workflow_dispatch:  # 允许手动触发

jobs:
  run-main:
    runs-on: ubuntu-latest
    permissions: 
        contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整历史记录以便推送

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # 使用你需要的Python版本

    - name: Install dependencies
      run: |
        pip install  fsb5 requests UnityPy==1.10.18


    - name: Run main.py
      run: timeout -v 15m python -u "run.py"

    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add .
        if [ -f VERSION ]; then
          git diff --quiet && git diff --staged --quiet || git commit -m "$(cat VERSION)"
        else
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update by GitHub Actions"
        fi
        git push --all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # 不取消正在运行的，等待完成